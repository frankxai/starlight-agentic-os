    - glama
    - smithery
    - mcp.so
    - pulsemcp
    - claude-code-marketplace    # own marketplace.json repo
    - awesome-lists              # punkpeye/awesome-mcp-servers, VoltAgent, RoggeOhta/awesome-codex-cli
    - hol-aggregator

