  generated_note: "README status matrix is generated from this file by scripts/gen_readme.py"
  index: "index/catalog.json — 418 skills catalogued (Phase D, 2026-07-24); security scan in index/security-scan-summary.md. Vector index (pgvector) authored, not yet built."
  registries_tracked:
