# ============================================================================
# Starlight Agentic OS — Pack Registry (Single Source of Truth)
# ============================================================================
# Every agent pack / plugin / skill-cluster Frank runs, builds, or absorbs.
# The four lifecycle states are tracked per pack under `status`:
#   install    : present and working            (done | partial | todo)
#   improve    : hardened to the quality bar     (todo | in-progress | done | deprecate-candidate)
#                (evals + rails + provenance)
#   indexed    : discoverable via semantic index (todo | done)
#   registered : published to operator registries (list; empty = none yet)
#
# origin: original (Frank/team authored) | absorbed (vendored upstream) | forked
# Status seeded 2026-07-23 from the Phase 1-3 portfolio audits. Counts are the
# corrected maxdepth-2 recount (Phase 2 §1), not the inflated pass-2 figures.
# CI (refresh-status.yml) writes `registered:` back into this file after publish.
# ============================================================================

meta:
