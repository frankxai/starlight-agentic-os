name: Registry release preflight

on:
  workflow_dispatch:
    inputs:
      pack:
        description: "pack name as listed in registry.yaml"
        required: true
        default: "starlight-skill-index"

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check build -r requirements-dev.txt
      - run: python3 scripts/validate_repo.py
      - run: python3 scripts/verify_certifications.py "${{ inputs.pack }}"
      - run: python3 -m build mcp-server
      - name: Stop before public mutation
        run: |
          echo "Preflight passed. Public PyPI/MCP Registry publication remains a named-human gate."
          echo "Follow REGISTER-PLAYBOOK.md after inspecting the built artifact and package identity."
