name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: agentic-os-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - run: python3 scripts/validate_repo.py
      - run: python3 mcp-server/test_server.py
      - run: python3 index/test_scan_skill_frontmatter.py
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: bash portable/verify-portability.sh portable/packs/acos-meta
      - run: python3 scripts/verify_certifications.py --all
      - run: python3 scripts/gen_readme.py --check
      - run: python3 scripts/sync_mcp_assets.py --check
      - run: python3 -m build --wheel --sdist mcp-server
      - run: python3 scripts/test_built_distribution.py
      - run: python3 -m compileall -q index mcp-server portable scripts
