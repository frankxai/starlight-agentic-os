name: refresh-status

# Keep the README status matrix in sync with registry.yaml, and (Phase E) pull
# published-state back from the registries into registry.yaml.

on:
  push:
    paths:
      - registry.yaml
      - scripts/gen_readme.py
  schedule:
    - cron: "0 6 * * 1"   # weekly, Mondays 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install deps
        run: pip install -r requirements-dev.txt
      - name: Verify matrix is current (gate)
        run: python scripts/gen_readme.py --check
      - name: Verify repository lifecycle invariants
        run: python scripts/validate_repo.py
