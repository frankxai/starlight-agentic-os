name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            mcp-server/requirements.txt

      - name: Install verification dependencies
        run: python -m pip install --disable-pip-version-check PyYAML "mcp>=1.2.0" build hatchling

      - name: Verify repository contract
        run: python scripts/verify_repo.py

      - name: Test MCP fallback path
        run: python mcp-server/test_server.py

      - name: Test security allowlist behavior
        run: python index/test_scan_skill_frontmatter.py

      - name: Compile Python sources
        run: python -m compileall -q index mcp-server scripts

      - name: Verify synchronized MCP package assets
        run: python scripts/sync_mcp_assets.py --check

      - name: Build MCP distribution
        run: python -m build --wheel --sdist mcp-server

      - name: Smoke-test installed MCP distribution
        run: python scripts/test_built_distribution.py
