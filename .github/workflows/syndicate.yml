name: Syndication plan

on:
  workflow_dispatch:
    inputs:
      pack:
        description: "pack name as listed in registry.yaml"
        required: true
        default: "starlight-skill-index"

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check pyyaml
      - run: python scripts/verify_certifications.py "${{ inputs.pack }}"
      - run: python scripts/syndicate.py "${{ inputs.pack }}" --dry-run
